<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You’re Invited – Rice Ceremony (Annaprashan)</title>
<meta property="og:title" content="You’re invited to our Rice Ceremony (Annaprashan)">
<meta property="og:description" content="Tap the envelope to open your invitation.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@400;500&display=swap">
<style>
:root{--bg1:#04123a;--bg2:#0a1c52;--w:min(92vw,440px,calc((100svh - 90px) / 1.117));color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg1) 70%);color:#fff;font-family:Poppins,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#field{position:fixed;inset:0;pointer-events:none;z-index:0}
#field i{position:absolute;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff;animation:tw var(--d,3s) ease-in-out var(--l,0s) infinite}
#field svg{position:absolute;fill:#fff;animation:tw2 var(--d,3s) ease-in-out var(--l,0s) infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
@keyframes tw2{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}

.stage{position:relative;width:var(--w);height:calc(var(--w) * 1.117);z-index:1}
.stage>*{position:absolute}
/* ----- envelope ----- */
.ep{left:5%;width:90%;height:calc(var(--w) * .6);top:calc(50% - var(--w) * .3);transition:opacity .8s ease}
.back{background:linear-gradient(#d8b878,#c9a45f);border-radius:6px;z-index:1;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.pl{background:#f2dfb2;clip-path:polygon(0 0,50% 52%,0 100%);z-index:3}
.pr{background:#ecd7a5;clip-path:polygon(100% 0,50% 52%,100% 100%);z-index:3}
.pb{background:linear-gradient(#f8ebc9,#f0dcae);clip-path:polygon(0 100%,50% 48%,100% 100%);z-index:3;border-radius:0 0 6px 6px}
.etext{z-index:4;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5%;font-family:'Dancing Script',cursive,serif;font-size:calc(var(--w) * .062);color:#9a6a2b;text-align:center}
.flap{left:5%;width:90%;height:calc(var(--w) * .34);top:calc(50% - var(--w) * .3);background:linear-gradient(#e6cd94,#f0dba8);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transform:perspective(900px) rotateX(0);z-index:5;transition:transform .7s ease,z-index 0s .3s,opacity .8s ease}
.seal{position:absolute;left:50%;top:100%;width:calc(var(--w) * .13);height:calc(var(--w) * .13);margin:calc(var(--w) * -.085) 0 0 calc(var(--w) * -.065);border-radius:50%;background:#d6456f;display:grid;place-items:center;animation:glow 1.8s ease-in-out infinite;transition:opacity .3s}
.seal svg{width:55%;fill:#fff}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,150,180,.7)}50%{box-shadow:0 0 0 10px rgba(255,150,180,0)}}
.hit{left:5%;width:90%;height:calc(var(--w) * .6);top:calc(50% - var(--w) * .3);z-index:9;background:none;border:0;cursor:pointer;border-radius:8px;padding:0}
.hit:focus-visible{outline:2px solid #ffe38a}
.hint{left:0;right:0;top:calc(50% + var(--w) * .38);text-align:center;font-size:calc(var(--w) * .04);color:#ffe38a;letter-spacing:.04em;animation:pulse 1.6s ease-in-out infinite;transition:opacity .4s;z-index:2}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.opening .flap{transform:perspective(900px) rotateX(180deg);z-index:0}
.opening .seal,.opening .hint{opacity:0}
.opening .hit{pointer-events:none}
.show .ep,.show .flap{opacity:0;pointer-events:none}

/* ----- card ----- */
.card{inset:0;z-index:2;overflow:hidden;border-radius:4px;color:#fff;container-type:inline-size;transform:scale(.5) translateY(0);transition:transform 1s cubic-bezier(.2,.85,.25,1);
background:linear-gradient(180deg,#051c44 0%,#062049 55%,#0a1b4b 100%);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.card>*{position:absolute}
.rising .card{transform:scale(.5) translateY(-62%)}
.show .card{transform:scale(1) translateY(0);z-index:10}
.art{left:0;bottom:0;width:66%;height:auto;z-index:1;opacity:0;transition:opacity 1s .3s;
-webkit-mask-image:linear-gradient(to right,#000 80%,transparent),linear-gradient(to bottom,transparent,#000 14%);-webkit-mask-composite:source-in;
mask-image:linear-gradient(to right,#000 80%,transparent),linear-gradient(to bottom,transparent,#000 14%);mask-composite:intersect}
.rising .art,.show .art{opacity:1}
.head{top:5.5%;left:0;right:0;text-align:center;z-index:3}
.head .s{font-size:3.3cqw;margin:0;color:#e9edff}
.head h1{font-family:'Dancing Script',cursive,serif;font-size:11.5cqw;line-height:1.05;margin:1cqw 0 0;font-weight:600}
.head .a{font-family:'Dancing Script',cursive,serif;font-size:5.2cqw;margin:0;color:#e9edff}
.head .nm{font-family:'Dancing Script',cursive,serif;font-size:6cqw;color:#ffe38a;margin:1.5cqw 0 0}
.head .t{font-size:3.5cqw;line-height:1.5;margin:3cqw 0 0}
.info{right:5%;top:41%;width:32%;z-index:3;display:flex;flex-direction:column;gap:5.5cqw}
.info div{display:flex;gap:2.4cqw;align-items:flex-start}
.info svg{flex:none;width:5.6cqw;height:5.6cqw;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-top:.4cqw}
.info p{margin:0}.info b{display:block;font-weight:500;font-size:3.4cqw}
.info span{display:block;font-size:3.2cqw;line-height:1.4;color:#e9edff}
.love{right:5%;bottom:5.5%;width:30%;z-index:3;font-family:'Dancing Script',cursive,serif;font-size:4.6cqw;line-height:1.25;rotate:-6deg}
.rv{opacity:0}
.show .rv{animation:fup .9s ease var(--d,0s) forwards}
@keyframes fup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* hanging yellow stars: pop down, then swing + glow */
.hg{top:0;z-index:2;width:7cqw}
.sw{display:block;width:100%;height:auto;transform-origin:50% 0}
.sw line{stroke:#c9b36a;stroke-width:.6}
.show .hg{animation:drop 1.1s cubic-bezier(.3,.7,.4,1) var(--d,0s) both}
.show .sw{animation:swing 3.2s ease-in-out calc(var(--d,0s) + 1.1s) infinite alternate,sg 1.8s ease-in-out infinite}
.hg:not(.sh){transform:translateY(-140%)}
@keyframes drop{0%{transform:translateY(-140%)}55%{transform:translateY(10%)}75%{transform:translateY(-4%)}100%{transform:translateY(0)}}
@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes sg{0%,100%{filter:drop-shadow(0 0 2px #ffd54a)}50%{filter:drop-shadow(0 0 7px #ffe58a)}}
.sp{z-index:2;width:3cqw;height:3cqw;color:#fff;animation:tw2 3s ease-in-out infinite}

.again{margin-top:14px;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:6px 16px;font:inherit;font-size:12px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s;z-index:2}
.done .again{opacity:.8;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#field i,#field svg,.sp,.hint,.seal,.show .sw{animation:none}}
</style>
</head>

<script>
/* ====== CHANGE YOUR DETAILS HERE ====== */
var INFO = {
  name:    '',                                   // baby name, e.g. 'Ahana' (leave '' to hide)
  date:    '2026-11-15',                         // YYYY-MM-DD
  time:    '11:00',                              // 24-hour, HH:MM
  venue:   'Our Home, Kolkata',
  tagline: 'A little bite today, a big dream tomorrow',
  from:    'With love, from our family'
};
/* ======================================= */
(function(){
  var $=function(i){return document.getElementById(i)};
  var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var W=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
  $('o-name').textContent=INFO.name?('of '+INFO.name):'';
  $('o-tag').textContent=INFO.tagline;
  var p=INFO.date.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  $('o-date').innerHTML=d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear()+'<br>('+W[d.getDay()]+')';
  var q=INFO.time.split(':'),h=+q[0],ap=h>=12?'PM':'AM';h=h%12||12;
  $('o-time').innerHTML=h+':'+q[1]+' '+ap+'<br>onwards';
  $('o-venue').innerHTML=esc(INFO.venue).replace(/,\s*/,',<br>');
  $('o-from').innerHTML=esc(INFO.from).replace(/,\s*/,',<br>');

  /* blinking stars on the whole page */
  var f=$('field'),h2='';
  for(var i=0;i<70;i++){
    var s=(Math.random()*2+1).toFixed(1);
    h2+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*100).toFixed(1)+'%;width:'+s+'px;height:'+s+'px;--d:'+(2+Math.random()*3).toFixed(1)+'s;--l:-'+(Math.random()*4).toFixed(1)+'s"></i>';
  }
  for(var j=0;j<12;j++){
    var z=(8+Math.random()*10).toFixed(0);
    h2+='<svg viewBox="0 0 24 24" style="left:'+(Math.random()*96).toFixed(1)+'%;top:'+(Math.random()*96).toFixed(1)+'%;width:'+z+'px;height:'+z+'px;--d:'+(2.5+Math.random()*3).toFixed(1)+'s;--l:-'+(Math.random()*4).toFixed(1)+'s"><use href="#sp"/></svg>';
  }
  f.innerHTML=h2;

  /* envelope sequence */
  var st=$('stage'),busy=false,timers=[];
  function open(){
    if(busy) return; busy=true;
    st.classList.add('opening');
    timers.push(setTimeout(function(){st.classList.add('rising')},750));
    timers.push(setTimeout(function(){st.classList.add('show')},1900));
    timers.push(setTimeout(function(){document.body.classList.add('done')},4200));
  }
  $('hit').addEventListener('click',open);
  $('again').addEventListener('click',function(){
    timers.forEach(clearTimeout);timers=[];
    document.body.classList.remove('done');
    st.classList.remove('show');
    setTimeout(function(){st.classList.remove('rising');
      setTimeout(function(){st.classList.remove('opening');busy=false},800)},900);
  });
})();
</script>
